<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Enhancement Module</title>
<style>
:root {
  --navy: #0f2744;
  --navy-2: #16355c;
  --accent: #c9a227;
  --accent-dark: #a8861b;
  --bg: #eef1f6;
  --card: #ffffff;
  --text: #1c2430;
  --muted: #6b7280;
  --line: #e5e7eb;
  --danger: #c0392b;
  --ok: #0f766e;
  --shadow: 0 10px 30px rgba(15, 39, 68, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Calibri, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h2, h3, h4 { margin: 0 0 12px; }

.muted { color: var(--muted); font-size: 13px; }

button, input, select {
  font-family: inherit;
}

input, select {
  width: 100%;
  padding: 11px 12px;
  margin: 0;
  border: 1px solid #d5dbe3;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  color: var(--text);
}

input:focus, select:focus {
  outline: none;
  border-color: #c9a227;
  box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.18);
}

button {
  border: none;
  cursor: pointer;
}

.btn-primary {
  background: var(--navy);
  color: #fff;
  padding: 11px 18px;
  border-radius: 8px;
  font-weight: 600;
}

.btn-primary:hover { background: var(--navy-2); }

.btn-edit {
  background: #e8eef8;
  color: var(--navy);
  padding: 7px 12px;
  border-radius: 6px;
  font-weight: 600;
}

.btn-delete {
  background: #fdecea;
  color: var(--danger);
  padding: 7px 12px;
  border-radius: 6px;
  font-weight: 600;
}

.actions { display: flex; gap: 8px; }

/* LOGIN */
body.booting #loginPage { display: none !important; }
#loginPage {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(15,39,68,.88), rgba(15,39,68,.7)),
    url("images_1.jpg") center/cover no-repeat;
}

.login-box {
  background: #fff;
  padding: 36px 32px;
  border-radius: 16px;
  width: 380px;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.brand-mark {
  width: 46px;
  height: 46px;
  border-radius: 10px;
  background: var(--navy);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-weight: 800;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.sidebar .brand-mark {
  width: 38px;
  height: 38px;
  margin-bottom: 0;
  background: #16355c;
}

.login-box h2 { font-size: 24px; }
.login-box p { margin: 0 0 22px; color: var(--muted); }
.login-box label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 600; }
.login-box .btn-primary { width: 100%; margin-top: 16px; }

/* APP SHELL */
#dashboard { display: none; }
.container { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px;
  background: var(--navy);
  color: #fff;
  padding: 22px 16px;
  flex-shrink: 0;
}

.sidebar .logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 22px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin-bottom: 18px;
}

.sidebar .logo span { font-weight: 700; letter-spacing: .2px; }
.sidebar .nav-label {
  font-size: 11px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #9bb0c9;
  padding: 0 10px 8px;
}

.sidebar button {
  width: 100%;
  padding: 11px 12px;
  margin: 4px 0;
  background: transparent;
  color: #d7e2ef;
  text-align: left;
  border-radius: 8px;
  font-size: 14px;
}

.sidebar button:hover,
.sidebar button.active {
  background: rgba(201, 162, 39, .18);
  color: #fff;
}

.main {
  flex: 1;
  padding: 24px 28px 40px;
  min-width: 0;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.title { font-size: 22px; font-weight: 700; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  padding: 8px 10px 8px 8px;
  border-radius: 999px;
  box-shadow: var(--shadow);
}

.profile img { width: 36px; height: 36px; border-radius: 50%; }
.profile .who { font-size: 13px; font-weight: 600; }
.profile .role { font-size: 11px; color: var(--muted); }

.logout {
  background: #f3f4f6;
  color: var(--navy);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid #edf0f4;
}

.section { display: none; }

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: 140px 1.4fr 1.2fr 110px auto;
  gap: 14px;
  align-items: end;
}

.g-labour { grid-template-columns: 130px 1.4fr 1.2fr 150px auto; }
.g-labour .form-btns { display: flex; gap: 8px; flex-wrap: nowrap; }
.g-labour .form-btns button { white-space: nowrap; }
.emp-table { table-layout: fixed; }
.emp-table th, .emp-table td { padding: 12px 24px; word-break: break-word; }
.pager-gap { padding: 6px 4px; color: #64748b; font-size: 13px; font-weight: 600; align-self: center; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.pager-info { font-size: 13px; color: #64748b; }
.pager-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.pager-btn { padding: 6px 11px; border-radius: 6px; background: #eef1f5; color: #334155; font-weight: 600; font-size: 13px; }
.pager-btn:hover:not(:disabled) { background: #e2e8f0; }
.pager-btn.active { background: var(--navy); color: #fff; }
.pager-btn:disabled { opacity: .45; cursor: default; }
.pager-btn.active:disabled { opacity: 1; }
.head-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.emp-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.emp-head h4 { margin: 0; }
.emp-search { width: 100%; max-width: 320px; }
.g-wage { grid-template-columns: 1.5fr 110px 1fr 1.1fr 1fr auto; }
.g-week { grid-template-columns: 1.6fr 120px 1fr auto; }
.g-month { grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 16px; }
.g-month input, .g-month select {
  padding: 13px 14px;
  font-size: 15px;
  min-height: 46px;
}
.g-month .btn-primary {
  width: 100%;
  min-height: 46px;
  padding: 13px 18px;
  font-size: 15px;
}
.g-month-2 { grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 12px; }
.g-month-2 .form-actions { flex-wrap: nowrap; gap: 8px; }
.g-month-2 .form-actions button { white-space: nowrap; min-height: 42px; padding: 10px 16px; }
.month-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: 10px;
  margin-top: 16px;
}
.month-actions button {
  flex: 0 0 auto;
  min-width: 130px;
  white-space: nowrap;
}
.month-date-wrap {
  min-width: 210px;
}
.month-date-wrap label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #4b5563;
  margin-bottom: 6px;
}
.g-att { grid-template-columns: 220px auto; }

.form-actions { display: flex; gap: 8px; }

.btn-clear {
  background: #eef1f5;
  color: #334155;
  padding: 11px 18px;
  border-radius: 8px;
  font-weight: 600;
}

.total-box {
  background: #f8fafc;
  border: 1px dashed #d5dbe3;
  font-weight: 800;
  color: var(--navy);
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #4b5563;
  margin-bottom: 6px;
}

.readonly {
  background: #f8fafc;
  color: #334155;
  font-weight: 700;
  letter-spacing: .4px;
}

.table-wrap { overflow-x: auto; }

/* WEEKLY EXPENDITURE */
.stats.stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.att-grid.wk-grid { min-width: 560px; }
.att-grid.wk-grid td input { min-width: 92px; font-size: 14px; }
.att-grid.wk-grid td.wk-cell { background: #fff; }
.att-grid.wk-grid thead th.att-sun { background: #eef4ff; color: var(--navy); border-color: var(--line); }
.att-grid.wk-grid td.wk-cell input:focus { background: #fff; }
.att-grid.wk-grid thead th { padding: 11px 10px; white-space: nowrap; }
.stats-navy .stat { background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-color: transparent; box-shadow: var(--shadow); }
.stats-navy .stat .k { color: #d6dfec; }
.stats-navy .stat .v { color: #fff; }
/* WORK AND TASK */
.g-task { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-task .span2 { grid-column: span 2; }
.g-task .span3 { grid-column: span 3; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #eef4ff; color: var(--navy); border-radius: 999px; padding: 5px 6px 5px 12px; font-weight: 600; font-size: 13px; }
.chip button { width: 20px; height: 20px; padding: 0; border-radius: 50%; background: #d3dff3; color: var(--navy); font-size: 14px; line-height: 1; }
.chip button:hover { background: var(--danger); color: #fff; }
.st-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.st-todo { background: #eceff3; color: #475569; }
.st-prog { background: #fbf1cf; color: #8a6d0b; }
.st-done { background: #d9f2ee; color: var(--ok); }
.names-cell { color: var(--muted); font-size: 13px; margin-top: 3px; }
.report-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.report-bar .field { display: flex; align-items: center; gap: 10px; }
.report-bar .field label { margin: 0; font-weight: 700; color: var(--navy); white-space: nowrap; }
.report-bar input[type=date] { width: 180px; }
.report-sum { font-weight: 700; color: var(--navy); }
/* ADVANCE PAYMENT */
.big-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.big-row .big-total { margin-bottom: 0; }
.big-total { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; border-radius: 14px; padding: 22px 26px; margin-bottom: 16px; box-shadow: var(--shadow); }
.big-total .k { font-size: 14px; font-weight: 600; color: #d6dfec; }
.big-total .v { font-size: 46px; font-weight: 800; line-height: 1.15; margin-top: 6px; color: #fff; }
.big-total .k small { margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(201, 162, 39, 0.2); color: var(--accent); font-size: 13px; font-weight: 700; }
.picker { position: relative; }
.picker-x { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; background: #eef1f5; color: #475569; font-size: 18px; line-height: 1; align-items: center; justify-content: center; padding: 0; }
.picker-x:hover { background: var(--danger); color: #fff; }
.picker.open .picker-x { display: flex; }
.picker.open input { padding-right: 42px; }
.icon-btn { width: 34px; height: 34px; padding: 0 !important; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.btn-dl { background: #e3f4f1; color: var(--ok); padding: 7px 12px; border-radius: 6px; font-weight: 600; }
.btn-dl:hover { background: #d3ece8; }
.picker-list { display: none; position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); max-height: 240px; overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.picker-list.open { display: block; }
.picker-item { padding: 9px 12px; cursor: pointer; font-size: 14px; }
.picker-item small { color: var(--muted); margin-left: 6px; }
.picker-item:hover, .picker-item.active { background: #eef4ff; }
.picker-none { padding: 10px 12px; color: var(--muted); font-size: 13px; }

/* ATTENDANCE GRID */
.att-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.att-month { display: flex; align-items: center; gap: 10px; }
.att-month label { margin: 0; font-weight: 700; color: var(--navy); white-space: nowrap; }
.att-month input { width: 190px; }
.att-actions { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; justify-content: flex-end; flex-wrap: wrap; }
.att-actions .emp-search { flex: 0 1 320px; }
.att-actions button { white-space: nowrap; }
.att-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.att-grid { border-collapse: collapse; width: 100%; min-width: 1100px; font-size: 13px; }
.att-grid th, .att-grid td { border: 1px solid var(--line); padding: 0; text-align: center; }
.att-grid thead th { background: var(--navy); color: #fff; font-weight: 700; padding: 10px 4px; border-color: var(--navy-2); }
.att-grid thead th.att-sun { background: var(--accent); color: var(--navy); border-color: var(--accent-dark); }
.att-grid thead th.att-name { min-width: 150px; position: sticky; left: 0; z-index: 2; }
.att-grid thead th.att-total { background: var(--navy-2); color: #fff; }
.att-grid td.att-name { background: #eef4ff; color: var(--navy); font-weight: 700; padding: 8px 10px; position: sticky; left: 0; z-index: 1; white-space: nowrap; }
.att-grid td input { width: 100%; min-width: 34px; border: 0; background: transparent; text-align: center; font-weight: 600; color: var(--text); padding: 8px 2px; border-radius: 0; box-shadow: none; }
.att-grid td input:focus { background: #fff8e1; outline: 2px solid var(--accent); outline-offset: -2px; }
.att-grid td.att-sun-col { background: #fbf6e3; }
.att-grid td.att-total { background: #eef4ff; color: var(--navy); font-weight: 700; padding: 8px 10px; min-width: 60px; }

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th {
  background: #f6f8fb;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #5b6777;
  text-align: left;
}

.table th, .table td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--line);
}

.table tbody tr:hover { background: #fbfcfe; }

.badge {
  display: inline-block;
  background: #eef4ff;
  color: var(--navy);
  font-weight: 700;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 999px;
}

.empty {
  text-align: center;
  padding: 28px 12px;
  color: var(--muted);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 16px;
}

.stat {
  background: #fff;
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid #edf0f4;
}

.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 24px; font-weight: 800; margin-top: 6px; color: var(--navy); }

.slider {
  width: 100%;
  height: 320px;
  overflow: hidden;
  border-radius: 12px;
}

.slider img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.toast {
  position: fixed;

  
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: 10px;
  display: none;
  box-shadow: var(--shadow);
  z-index: 100;
}

.row-new { animation: flash 1.4s ease; }

@keyframes flash {
  from { background: #fff7d6; }
  to { background: transparent; }
}


/* PROFILE */
.profile-link { display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 999px; }
.profile-link:hover .who { text-decoration: underline; }
.profile img { object-fit: cover; }
.profile-hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.avatar-block { display: flex; flex-direction: column; align-items: center; }
.avatar-lg { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: #eef1f5; border: 3px solid #fff; box-shadow: var(--shadow); }
.avatar-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.avatar-actions button { padding: 7px 12px; font-size: 12px; }
.hero-info h3 { margin: 0 0 4px; font-size: 22px; }
.hero-info .badge { margin-top: 10px; }
.g-profile { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-actions-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.ro-note { display: none; background: #fff7e6; border: 1px solid #ffe2a8; color: #8a5a00; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
body.ro .section:not(#profileSection) .btn-primary:not(.keep),
body.ro .section:not(#profileSection) .btn-edit,
body.ro .section:not(#profileSection) .btn-delete,
body.ro .section:not(#profileSection) .btn-clear:not(.keep) { display: none !important; }

@media (max-width: 980px) {
  .container { flex-direction: column; }
  .sidebar { width: 100%; height: auto; }
  .form-grid, .g-labour, .g-wage, .g-week, .g-month, .g-month-2, .g-att, .g-profile, .g-task, .stats {
    grid-template-columns: 1fr;
  }
  .g-task .span2, .g-task .span3 { grid-column: auto; }
  .stats.stats-3 { grid-template-columns: 1fr; }
  .big-row { grid-template-columns: 1fr; }
}

/* FUTURE MODULE PAGE */
.fm-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
.fm-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.fm-top h2 { margin: 0; color: var(--navy); }
.fm-top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.fm-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.fm-tabs button { padding: 9px 18px; border-radius: 8px; background: #fff; color: var(--navy); font-weight: 700; border: 1px solid var(--line); cursor: pointer; }
.fm-tabs button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.fm-note { background: #fff7e0; border: 1px solid #f0dca0; color: #6b5200; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
</style>
</head>
<body>

<div class="fm-wrap">
  <div class="fm-top">
    <div>
      <h2>Future Enhancement Module</h2>
      <p>Income, Expenditure and Materials &mdash; moved out of the main app for a later release.</p>
    </div>
    <div class="brand-mark" style="margin:0">PIC</div>
  </div>

  <div class="fm-note" id="fmNote" style="display:none"></div>

  <div class="fm-tabs">
    <button class="active" onclick="fmShow('incomeSection', this)">Income</button>
    <button onclick="fmShow('expenseSection', this)">Expenditure</button>
    <button onclick="fmShow('materialSection', this)">Materials</button>
  </div>

      <div id="incomeSection" class="section">
        <div class="card">
          <h4>Add income</h4>
          <div class="form-grid" style="grid-template-columns: 1.4fr 1fr auto;">
            <div class="field"><label>Source</label><input id="incomeSource" placeholder="Source"></div>
            <div class="field"><label>Amount</label><input id="incomeAmount" placeholder="Amount"></div>
            <div class="field"><button class="btn-primary" onclick="addIncome()">Add</button></div>
          </div>
        </div>
        <div class="card">
          <table class="table">
            <thead><tr><th>Source</th><th>Amount</th></tr></thead>
            <tbody id="incomeTable"></tbody>
          </table>
        </div>
      </div>

      <div id="expenseSection" class="section">
        <div class="card">
          <h4>Add expenditure</h4>
          <div class="form-grid" style="grid-template-columns: 1.4fr 1fr auto;">
            <div class="field"><label>Description</label><input id="expDesc" placeholder="Description"></div>
            <div class="field"><label>Amount</label><input id="expAmount" placeholder="Amount"></div>
            <div class="field"><button class="btn-primary" onclick="addExpense()">Add</button></div>
          </div>
        </div>
        <div class="card">
          <table class="table">
            <thead><tr><th>Description</th><th>Amount</th></tr></thead>
            <tbody id="expenseTable"></tbody>
          </table>
        </div>
      </div>

      <div id="materialSection" class="section">
        <div class="card">
          <h4>Add material</h4>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr auto;">
            <div class="field">
              <label>Material type</label>
              <select id="materialType" onchange="updateMaterialOptions()">
                <option value="">Select</option>
                <option value="Concrete">Concrete</option>
                <option value="Steel">Steel</option>
                <option value="Others">Others</option>
              </select>
            </div>
            <div class="field">
              <label>Details</label>
              <select id="materialDetail"></select>
            </div>
            <div class="field">
              <label>Order date</label>
              <input type="date" id="orderDate">
            </div>
            <div class="field">
              <label>Amount paid</label>
              <input id="amountPaid" placeholder="Enter amount">
            </div>
            <div class="field">
              <button class="btn-primary" onclick="addMaterial()">Add</button>
            </div>
          </div>
        </div>
        <div class="card">
          <table class="table">
            <thead>
              <tr><th>Material</th><th>Details</th><th>Date</th><th>Amount</th></tr>
            </thead>
            <tbody id="materialTable"></tbody>
          </table>
        </div>
      </div>

</div>

<div class="toast" id="toast"></div>

<script>
let incomes = [];
let expenses = [];
let materials = [];

function notify(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 1800);
}

function fmWarn(msg) {
  fmNote.textContent = msg;
  fmNote.style.display = 'block';
}

function save(key, value) {
  fetch('/api/data/' + key, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value)
  }).then(r => {
    if (r.status === 401) return fmWarn('Session expired. Please sign in again from index.html.');
    if (r.status === 403) return alert('You have read-only access, so this change was not saved.');
    if (!r.ok) throw new Error('save failed');
  }).catch(() => alert('Could not save to the database. Make sure the server is running (node server.js).'));
}

function updateStats() {}   // dashboard counters were removed from index.html

function addIncome() {
  if (!incomeSource.value || !incomeAmount.value) return alert('Enter source and amount');
  incomes.push({ source: incomeSource.value, amount: incomeAmount.value });
  save('incomes', incomes);
  incomeSource.value = '';
  incomeAmount.value = '';
  renderIncomes();
  updateStats();
}

function renderIncomes() {
  incomeTable.innerHTML = incomes.map(i => `<tr><td>${i.source}</td><td>${i.amount}</td></tr>`).join('');
}

function addExpense() {
  if (!expDesc.value || !expAmount.value) return alert('Enter description and amount');
  expenses.push({ desc: expDesc.value, amount: expAmount.value });
  save('expenses', expenses);
  expDesc.value = '';
  expAmount.value = '';
  renderExpenses();
  updateStats();
}

function renderExpenses() {
  expenseTable.innerHTML = expenses.map(e => `<tr><td>${e.desc}</td><td>${e.amount}</td></tr>`).join('');
}

function updateMaterialOptions() {
  const type = materialType.value;
  materialDetail.innerHTML = '';
  let opts = [];
  if (type === 'Concrete') opts = ['M10', 'M15', 'M20', 'M25', 'M30', 'M35'];
  if (type === 'Steel') opts = ['8mm', '10mm', '12mm', '16mm', '20mm', '22mm', '25mm'];
  if (type === 'Others') opts = ['Bricks', 'Plaster', 'Paint'];
  opts.forEach(v => materialDetail.innerHTML += `<option>${v}</option>`);
}

function addMaterial() {
  if (!materialType.value) return alert('Select material type');
  materials.push({
    type: materialType.value,
    detail: materialDetail.value,
    date: orderDate.value,
    amount: amountPaid.value
  });
  save('materials', materials);
  renderMaterials();
  updateStats();
}

function renderMaterials() {
  materialTable.innerHTML = materials.map(m =>
    `<tr><td>${m.type}</td><td>${m.detail}</td><td>${m.date}</td><td>${m.amount}</td></tr>`
  ).join('');
}


function fmShow(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  document.querySelectorAll('.fm-tabs button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

(async function init() {
  fmShow('incomeSection', document.querySelector('.fm-tabs button'));
  try {
    const r = await fetch('/api/data');
    if (r.status === 401) return fmWarn('Please sign in from index.html first, then reopen this page.');
    const d = await r.json();
    incomes = d.incomes || [];
    expenses = d.expenses || [];
    materials = d.materials || [];
  } catch (e) {
    fmWarn('Could not reach the server. Start it with node server.js.');
  }
  renderIncomes();
  renderExpenses();
  renderMaterials();
})();
</script>
</body>
</html>
